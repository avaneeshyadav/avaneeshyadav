name: Update README with latest blog posts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://buildingai.in/rss.xml"
          max_post_count: 5
          date_format: "ddd, DD MMM YYYY"
